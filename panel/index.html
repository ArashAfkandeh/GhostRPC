<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>GhostRPC</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/i18n.js"></script>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="ghost-mark-bg" x1="5" y1="3" x2="43" y2="46" gradientUnits="userSpaceOnUse"><stop stop-color="#253b60"/><stop offset="1" stop-color="#101827"/></linearGradient>
          <linearGradient id="ghost-mark" x1="15" y1="9" x2="34" y2="38" gradientUnits="userSpaceOnUse"><stop stop-color="#d8e5ff"/><stop offset="1" stop-color="#83a6ff"/></linearGradient>
        </defs>
        <rect x="1" y="1" width="46" height="46" rx="15" fill="url(#ghost-mark-bg)" stroke="#425a80" stroke-width="1.5"/>
        <path d="M5 24h7m24 0h7" stroke="#4fd8b4" stroke-linecap="round" stroke-width="2.5"/>
        <circle cx="5" cy="24" r="2" fill="#4fd8b4"/><circle cx="43" cy="24" r="2" fill="#4fd8b4"/>
        <path d="M24 9.5c-6 0-9.5 4.3-9.5 9.8v14.8l3.8-2.7 3.8 2.7 3.8-2.7 3.8 2.7 3.8-2.7V19.3c0-5.5-3.5-9.8-9.5-9.8Z" fill="url(#ghost-mark)" stroke="#eff4ff" stroke-linejoin="round" stroke-width="1.2"/>
        <circle cx="20.5" cy="20" r="1.55" fill="#18243a"/><circle cx="27.5" cy="20" r="1.55" fill="#18243a"/>
        <path d="M20 25.5h8" stroke="#18243a" stroke-linecap="round" stroke-width="1.6"/>
      </svg>
      <div><h1>GhostRPC</h1><p><span id="role-badge"></span><span class="brand-version ltr" id="version"></span></p></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="community-card">
        <div class="repo-heading">
          <a class="github-avatar-link" href="https://github.com/ArashAfkandeh" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile">
            <img class="github-avatar" src="https://github.com/ArashAfkandeh.png?size=64" alt="Arash Afkandeh">
          </a>
          <a class="repo-link" href="https://github.com/ArashAfkandeh/GhostRPC" target="_blank" rel="noopener noreferrer">
            <span class="repo-title" data-i18n="github_project"></span>
          </a>
        </div>
        <div class="community-actions">
          <a class="repo-star-button" href="https://github.com/ArashAfkandeh/GhostRPC" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m12 2.8 2.8 5.7 6.3.9-4.55 4.43 1.08 6.27L12 17.14l-5.63 2.96 1.08-6.27L2.9 9.4l6.3-.92L12 2.8Z"/></svg>
            <span id="repo-star-count" class="repo-star-count ltr num" data-i18n="loading"></span>
          </a>
          <a class="telegram-link" href="tg://resolve?domain=ArashAfkandeh" target="_blank" rel="noopener noreferrer" title="Contact support on Telegram" aria-label="Contact support on Telegram">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.6 4.2 18.4 20c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L5.8 13.5.9 12c-1.1-.3-1.1-1 .2-1.5L20.2 3c.9-.3 1.7.2 1.4 1.2Z"/></svg>
            <span>Support</span>
          </a>
        </div>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="top">
      <button class="btn ghost icon menu-btn" id="menu-btn" type="button" aria-label="menu"></button>
      <h2 id="page-title"></h2>
      <span class="grow"></span>
      <span class="badge mute" id="conn-badge"></span>
      <button class="btn ghost sm" id="lang-btn" type="button" data-i18n-title="switch_lang"></button>
      <button class="btn ghost icon sm" id="theme-btn" type="button" data-i18n-title="switch_theme" aria-label="theme"></button>
      <button class="btn ghost sm" id="logout-btn" type="button"><span data-i18n="sign_out"></span></button>
    </header>

    <main class="content">
      <div class="banner warn hidden" id="banner-pw">
        <span data-i18n="change_pw_banner"></span>
        <a class="btn sm" href="#account" data-i18n="change_password"></a>
      </div>
      <div class="banner bad hidden" id="banner-offline"><span data-i18n="offline_banner"></span></div>

      <!-- ================= dashboard ================= -->
      <section class="page" id="page-dashboard">
        <div class="card hero chart-wrap">
          <div class="hero-head">
            <div class="rate">
              <div class="name"><span class="dot tx"></span><span data-i18n="tx"></span></div>
              <div class="big num"><span id="tx-rate" class="ltr"></span></div>
              <div class="tot"><span data-i18n="total"></span>: <span id="tx-total" class="ltr num"></span></div>
            </div>
            <div class="rate">
              <div class="name"><span class="dot rx"></span><span data-i18n="rx"></span></div>
              <div class="big num"><span id="rx-rate" class="ltr"></span></div>
              <div class="tot"><span data-i18n="total"></span>: <span id="rx-total" class="ltr num"></span></div>
            </div>
            <div class="seg" id="range-seg">
              <button type="button" data-res="sec" aria-pressed="true" data-i18n="range_15m"></button>
              <button type="button" data-res="min" aria-pressed="false" data-i18n="range_24h"></button>
            </div>
          </div>
          <div class="chart" id="chart"></div>
        </div>

        <div class="spacer"></div>
        <div class="grid dashboard-layout">
          <div class="card kpi"><div class="label"><span class="dot ok" id="kpi-state-dot"></span><span data-i18n="state"></span></div><div class="value" id="kpi-state"></div><div class="sub" id="kpi-state-sub"></div></div>
          <div class="card kpi"><div class="label" data-i18n="active_streams"></div><div class="value num" id="kpi-streams"></div><div class="sub"><span data-i18n="since_start"></span>: <span id="kpi-streams-total" class="ltr num"></span></div></div>
          <div class="card kpi session-kpi"><div class="label"><span class="dot rx"></span><span data-i18n="tunnel_sessions"></span></div><div class="value num" id="kpi-sessions"></div><div class="session-breakdown" id="kpi-sessions-sub"></div></div>
          <div class="card insight-card route-card"><h3 data-i18n="route"></h3><div class="route" id="route"></div></div>
          <div class="card kpi rejected-kpi"><div class="label" data-i18n="rejected"></div><div class="value num" id="kpi-rejected"></div><div class="sub" data-i18n="rejected_sub"></div></div>
        </div>

        <div class="spacer"></div>
        <div class="grid g-2">
          <div class="card insight-card system-card"><h3 data-i18n="system"></h3><div class="resources-grid" id="system"></div></div>
          <div class="card insight-card summary-card"><h3 data-i18n="summary"></h3><dl class="kv config-summary" id="summary"></dl></div>
        </div>
      </section>

      <!-- ================= tunnels ================= -->
      <section class="page" id="page-tunnels">
        <div class="card">
          <h3 data-i18n="protocol_order"></h3>
          <div class="chips" id="protos"></div>
          <p class="mute" data-i18n="protocol_hint"></p>
          <div class="current-tunnel-type" id="current-tunnel-type"></div>
        </div>
        <div class="spacer"></div>
        <div class="card flush tunnel-table-card" id="nodes-card">
          <section id="direct-nodes-section">
            <h3 data-i18n="direct_tunnel"></h3>
            <div class="table-wrap"><table><thead><tr>
              <th data-i18n="location"></th><th>SNI</th><th data-i18n="pool"></th><th data-i18n="latency"></th><th data-i18n="state"></th>
            </tr></thead><tbody id="nodes"></tbody></table></div>
          </section>
        </div>
        <div class="spacer"></div>
        <div class="card flush tunnel-table-card" id="reverse-card">
          <section id="reverse-section">
            <h3 id="reverse-title" data-i18n="reverse_title"></h3>
            <div class="table-wrap"><table><thead><tr>
              <th data-i18n="location"></th><th>SNI</th><th data-i18n="pool"></th><th data-i18n="latency"></th><th data-i18n="state"></th>
            </tr></thead><tbody id="reverse"></tbody></table></div>
          </section>
        </div>
        <div class="spacer"></div>
        <div class="grid g-2">
          <div class="card" id="clean-card"><h3><span data-i18n="clean_ips"></span><span class="grow"></span><button class="btn sm clean-rescan" id="rescan-clean-ips" type="button" data-i18n="rescan_clean_ips"></button></h3><div id="clean"></div></div>
          <div class="card" id="dead-card">
            <h3><span data-i18n="dead_targets"></span><span class="grow"></span><button class="btn sm" id="clear-dead" type="button" data-i18n="clear_dead"></button></h3>
            <p class="mute" data-i18n="dead_hint"></p>
            <div class="chips" id="dead"></div>
          </div>
        </div>
      </section>

      <!-- ================= connections ================= -->
      <section class="page" id="page-connections">
        <div class="toolbar">
          <input class="input sm" id="conn-filter" type="search" data-i18n-ph="filter_ph">
          <span class="grow"></span>
          <span class="mute"><span data-i18n="open_streams"></span>: <b id="conn-total" class="ltr num"></b></span>
        </div>
        <div class="card flush">
          <div class="table-wrap"><table><thead><tr>
            <th data-i18n="kind"></th><th data-i18n="protocol"></th><th data-i18n="source"></th><th data-i18n="target"></th><th data-i18n="age"></th>
          </tr></thead><tbody id="conns"></tbody></table></div>
        </div>
        <p class="mute" id="conn-note"></p>
      </section>

      <!-- ================= logs ================= -->
      <section class="page" id="page-logs">
        <div class="toolbar">
          <select class="input sm" id="log-level" aria-label="level">
            <option value="">ALL</option><option value="DEBUG">DEBUG+</option><option value="INFO" selected>INFO+</option><option value="WARN">WARN+</option><option value="ERROR">ERROR</option>
          </select>
          <input class="input sm" id="log-filter" type="search" data-i18n-ph="filter_ph">
          <button class="btn sm" id="log-pause" type="button"></button>
          <button class="btn sm" id="log-clear" type="button" data-i18n="clear_view"></button>
          <button class="btn sm" id="log-download" type="button" data-i18n="download"></button>
        </div>
        <div class="logbox" id="logbox" tabindex="0"></div>
      </section>

      <!-- ================= config ================= -->
      <section class="page" id="page-config">
        <div class="banner info hidden" id="cfg-readonly"><span data-i18n="read_only_note"></span></div>
        <div class="banner warn hidden" id="cfg-conflict"><span data-i18n="conflict_note"></span><button class="btn sm" id="cfg-reload-file" type="button" data-i18n="load_latest"></button></div>
        <div class="card">
          <h3><span data-i18n="config_file"></span><span class="mono ltr mute" id="cfg-path"></span></h3>
          <div class="editor-shell">
            <pre class="editor-highlight" id="editor-highlight" aria-hidden="true"></pre>
            <textarea class="editor" id="editor" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off" dir="ltr" aria-label="config"></textarea>
          </div>
          <div class="status-line"><span id="cfg-pos" class="ltr num"></span><span id="cfg-dirty"></span><span id="cfg-mtime"></span></div>
          <div id="cfg-result"></div>
          <div class="row spacer-top">
            <button class="btn" id="cfg-guide" type="button" data-i18n="config_guide"></button>
            <button class="btn" id="cfg-validate" type="button" data-i18n="validate"></button>
            <button class="btn primary" id="cfg-save" type="button" data-i18n="save_apply"></button>
            <button class="btn ghost" id="cfg-revert" type="button" data-i18n="revert"></button>
            <button class="btn" id="cfg-download" type="button" data-i18n="download_toml"></button>
            <span class="grow"></span>
            <button class="btn" id="cfg-reload" type="button" data-i18n="reload_now"></button>
          </div>
        </div>
        <div class="spacer"></div>
        <div class="card">
          <h3 data-i18n="backups"></h3>
          <p class="mute" data-i18n="backups_hint"></p>
          <div class="list" id="backups"></div>
        </div>
      </section>

      <!-- ================= certificates ================= -->
      <section class="page" id="page-certs">
        <div class="card flush">
          <div class="table-wrap"><table><thead><tr>
            <th data-i18n="zone"></th><th data-i18n="issued"></th><th data-i18n="expires"></th><th data-i18n="remaining"></th><th data-i18n="state"></th>
          </tr></thead><tbody id="certs"></tbody></table></div>
        </div>
        <p class="mute" data-i18n="certs_hint"></p>
      </section>

      <!-- ================= account ================= -->
      <section class="page" id="page-account">
        <div class="grid g-2">
          <form class="card" id="pw-form" autocomplete="off">
            <h3 data-i18n="change_password"></h3>
            <input type="text" name="username" autocomplete="username" class="hidden" tabindex="-1" aria-hidden="true">
            <div class="field"><label for="pw-cur" data-i18n="current_password"></label><input class="input" id="pw-cur" type="password" autocomplete="current-password" dir="ltr" required></div>
            <div class="field"><label for="pw-new" data-i18n="new_password"></label><input class="input" id="pw-new" type="password" autocomplete="new-password" dir="ltr" minlength="10" required><span class="mute" data-i18n="password_rule"></span></div>
            <div class="field"><label for="pw-new2" data-i18n="repeat_password"></label><input class="input" id="pw-new2" type="password" autocomplete="new-password" dir="ltr" required></div>
            <div id="pw-result"></div>
            <button class="btn primary" type="submit" data-i18n="save_password"></button>
          </form>
          <div class="card">
            <h3><span data-i18n="active_sessions"></span></h3>
            <p class="mute" data-i18n="sessions_hint"></p>
            <div class="list" id="my-sessions"></div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog id="dlg"><h3 id="dlg-title"></h3><p id="dlg-text"></p><div class="row"><button class="btn" id="dlg-no" type="button"></button><button class="btn primary" id="dlg-yes" type="button"></button></div></dialog>
<dialog id="cfg-guide-dialog" class="guide-dialog" aria-labelledby="cfg-guide-title">
  <h3 id="cfg-guide-title" data-i18n="config_guide"></h3>
  <p class="mute" data-i18n="config_guide_hint"></p>
  <div class="row guide-tabs" role="tablist" aria-label="Configuration examples">
    <button class="btn sm" id="cfg-guide-client" type="button" role="tab" aria-selected="true" data-i18n="config_guide_client"></button>
    <button class="btn sm" id="cfg-guide-server" type="button" role="tab" aria-selected="false" data-i18n="config_guide_server"></button>
  </div>
  <pre class="guide-sample ltr" id="cfg-guide-sample" dir="ltr" tabindex="0"></pre>
  <div class="row guide-actions"><span class="grow"></span><button class="btn primary" id="cfg-guide-close" type="button" data-i18n="close"></button></div>
</dialog>
<script src="/assets/modules/core.js"></script>
<script src="/assets/modules/dashboard.js"></script>
<script src="/assets/modules/tunnels.js"></script>
<script src="/assets/modules/connections.js"></script>
<script src="/assets/modules/logs.js"></script>
<script src="/assets/modules/config.js"></script>
<script src="/assets/modules/certs.js"></script>
<script src="/assets/modules/account.js"></script>
</body>
</html>
