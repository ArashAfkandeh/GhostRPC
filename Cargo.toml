[package]
name = "GhostRPC"
version = "1.0.1"
edition = "2024"

[dependencies]
tokio = { version = "1.48", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
futures = "0.3"
tokio-util = "0.7.14"
h2 = "0.4.8"
http = "1.3.1"
rustls = { version = "0.23.25", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26.2"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.0"
bytes = "1.10.1"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["env-filter", "fmt", "ansi"] }
webpki-roots = "1.0.1"
socket2 = "0.6.1"
mimalloc = "0.1.44"
libc = "0.2.172"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "json", "http2"] }
instant-acme = "0.8.5"
rcgen = { version = "0.14.8", default-features = false, features = ["pem", "ring"] }
serde_json = "1.0"
sha2 = "0.11.0"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
ipnet = "2.9.0"
rand = "0.10.2"
generic-array = "1.4.4"
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
hyper = { version = "1.11.0", features = ["server", "http1", "http2", "client"] }
hyper-util = { version = "0.1.20", features = ["full"] }
fastcgi-client = { version = "0.11.1", features = ["runtime-tokio", "http"] }
http-body-util = "0.1.4"
futures-util = "0.3.33"
tungstenite = "0.21.0"
dashmap = "6"
mime_guess = "2"
ws_stream_tungstenite = { version = "0.13.0", features = ["tokio"] }
yamux = "0.10.1"
tokio-tungstenite = { version = "0.21.0", features = ["stream"] }
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
