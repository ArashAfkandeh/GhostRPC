[server]

# آدرس و پورتی که سرور روی آن گوش می‌دهد
bind_addr = "0.0.0.0:443"

# رمز عبور مشترک بین سرور و کلاینت برای احراز هویت
secret = "my_secret_password"

# مسیر مخفی برای درخواست‌های تونل (باید با کلاینت یکی باشد)
hidden_path = "/api/v4/telemetry"

# هدف استتار (Active Probing Defense) - می‌تواند سایت ("https://www.ubuntu.com") یا مسیر فایل محلی ("/root/GhostRPC/html/index.html") باشد.
camouflage_target = "https://www.ubuntu.com"

# تنظیمات دریافت خودکار گواهینامه Let's Encrypt (DNS-01 Challenge)
cloudflare_api_token = "YOUR_CLOUDFLARE_API_TOKEN"
arvancloud_api_token = "YOUR_ARVANCLOUD_API_TOKEN"

# دامنه‌ها و زیردامنه‌های مجاز برای برقراری تونل (ترافیک این دامنه‌ها پردازش تونل می‌شود)
tunnel_sni = [
    "domain.com",
    "*.domain.com"
]

# (اختیاری) کپی خودکار گواهینامه‌های تولید شده/تمدید شده به مسیرهای مشخص (پوشه certs ایجاد می‌شود)
copy_certs_to = [
    "/etc/xray",
    "/opt/proxy"
]

# (اختیاری) سطح لاگ‌گیری سیستم: "trace", "debug", "info", "warn", "error"
log_level = "info"

# (اختیاری) فاصلهٔ اسکن Clean IPهای Reverse (دقیقه؛ پیش‌فرض ۶۰)
check_interval_minutes = 30

# (اختیاری) حداکثر زمان اتصال TCP برای بررسی هر IP (میلی‌ثانیه؛ پیش‌فرض ۱۵۰)
max_ping_ms = 200

# 🔀 (اختیاری) پروتکل‌های تانل، به ترتیب اولویت
#  "h2" = HTTP/2 (gRPC)  |  "wssmux" = WebSocket روی TLS + multiplexer (yamux)
# سرور روی همین پورت هر پروتکلِ فهرست‌شده را می‌پذیرد (تشخیص با ALPN: http/1.1 = wssmux، h2 = gRPC)
# و dialerهای [[server.reverse]] به ترتیب اولویت وصل می‌شوند و در صورت شکست خودکار به بعدی می‌روند.
# اگر ننویسید: ["h2", "wssmux"]. برای رفتار قبلی: ["h2"]
# protocols = ["h2", "wssmux"]

# تنظیمات مسیریابی فوق‌سریع ترافیک بر اساس دامنه (SNI Routing)
# در این بخش می‌توانید تعیین کنید که اگر کلاینت با یکی از دامنه‌های زیر به سرور متصل شد،
# ترافیک آن بدون بازگشایی رمزنگاری (Zero-Copy) مستقیماً به آی‌پی و پورت مشخص شده هدایت شود.
[[server.sni_proxy]]
incoming_sni = [
    "us.SNI.COM:443",
    "fr.SNI.COM:443",
    "tr.SNI.COM:443",
]
target = [
    "127.0.0.1:9443",
]


# ====================================================================
# مسیرهای مستقل کلاینت به عنوان وب‌سرور لایه ۷
# ترافیک را روی پورت لوکال با گواهی سرور دریافت و پردازش می‌کند.
# ====================================================================

# 1. حالت استاتیک (نمایش فایل‌های پنل یا HTML)
[[server.web_server]]
domain = "panel.example.com"
path = "/"
type = "static"
root = "panel_ui/dist"

# 2. حالت استاتیک پیشرفته با Rewrite مسیر
[[server.web_server]]
domain = "static.example.com"
path = "/"
type = "static"
root = "/var/www/html"
"/" = "/index.html"

# 3. حالت FastCGI (برای سایت‌های PHP)
[[server.web_server]]
domain = "dl.example.com"
path = "/"
type = "fastcgi"
root = "/var/www/html"
target = "unix:///var/run/php/php8.1-fpm.sock"
"/" = "/download.php"

# 4. حالت Reverse Proxy (برای اتصال به وب‌پنل یا سرویس‌های دیگر)
[[server.web_server]]
domain = "chat.example.com"
path = "/"
type = "reverse_proxy"
target = "127.0.0.1:8080"

# ====================================================================
# 🔁 حالت Reverse (اختیاری) — همزمان با تانل Direct فعال می‌ماند و از CDN (Cloudflare) عبور می‌کند
# ====================================================================
# در حالت Reverse، خودِ این سرور (خارج) به کلاینت (ایران) وصل می‌شود؛ دامنهٔ کلاینت می‌تواند پشت Cloudflare باشد.
# `secret` و `hidden_path` همین بخش [server] استفاده می‌شوند و گواهی TLS همیشه اعتبارسنجی می‌شود (مثل Direct).
#
# [[server.reverse]]
# sni = "respina.example.com:2083"       # دامنه (پروکسی‌شده در CF) برای SNI و Host، اختیاراً با :پورت (پیش‌فرض ۴۴۳)
# clean_ip = ["104.16.1.1", "104.17.2.2"] # (اختیاری) آی‌پی‌های تمیز CF یا دامنه؛ بدون پورت = پورتِ sni. هر اتصال بین همه race می‌شود
#                                        # اگر clean_ip را ننویسید، خودِ دامنهٔ sni استفاده می‌شود
# pool_size = 8                          # (اختیاری) تعداد اتصال HTTP/2 همزمان؛ هرکدام ۴ stream آماده (پیش‌فرض ۸ = ۳۲ stream آماده)
# location = "Germany"                   # (اختیاری) بدون location: فقط فورواردر (اتصال مستقیم به هاست مقصد). با location: برای مقصدهای همان لوکیشن به localhost وصل می‌شود + قوانین share_sni

# ====================================================================
# 🖥️ وب‌پنل مدیریت (اختیاری) — ورود با نام کاربری و رمز عبور
# ====================================================================
# پنل داخل خودِ برنامه اجرا می‌شود (بدون نیاز به وب‌سرور یا دیتابیس جدا) و داشبورد ترافیک زنده،
# وضعیت تانل‌ها و اتصال‌ها، لاگ، ویرایشگر تنظیمات (با Hot-Reload و نسخه‌ی پشتیبان) و وضعیت گواهی‌ها را نشان می‌دهد.
# پیش‌فرض فقط روی 127.0.0.1 گوش می‌دهد.
#
# دسترسی امن از راه دور:
#   الف) تونل SSH:  ssh -L 8088:127.0.0.1:8088 user@server  و سپس باز کردن http://127.0.0.1:8088
#   ب) انتشار با TLS از طریق وب‌سرور داخلی (reverse_proxy به 127.0.0.1:8088) و تنظیم trust_proxy = true
[admin]
enabled = true
bind_addr = "127.0.0.1:8088"
# نام کاربری و رمز ورود را همین‌جا تعیین کنید (با ذخیره‌ی فایل و Hot-Reload بلافاصله اعمال می‌شود؛ رمز دست‌کم ۱۰ نویسه):
username = "admin"
password = "admin"
# اگر password را ننویسید، در اولین اجرا رمز تصادفی ساخته و فقط یک‌بار در ترمینال چاپ می‌شود
# (و در فایل admin_credentials.json ذخیره می‌شود). با تعیین password، آن فایل دیگر استفاده نمی‌شود.
# توصیه: دسترسی فایل پیکربندی را محدود کنید:  chmod 600 config.toml
# credentials_file = "admin_credentials.json"
# session_ttl_minutes = 480          # مدت بی‌فعالیتی تا خروج خودکار
# trust_proxy = false                # فقط پشت reverse_proxy داخلی/معتبر true کنید
# read_only = false                  # true = پنل فقط نمایش می‌دهد و تغییر/عملیات را رد می‌کند

[[server.web_server]]
domain = "panel.example.com"
path = "/"
type = "reverse_proxy"
target = "127.0.0.1:8088"
