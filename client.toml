[client]

# رمز عبور مشترک بین سرور و کلاینت برای احراز هویت
secret = "my_secret_password"

# مسیر مخفی برای درخواست‌های تونل (باید با سرور یکی باشد)
hidden_path = "/api/v4/telemetry"

# دامنه‌های مجاز برای دریافت گواهینامه ACME (اختیاری)
acme_domains = [
    "example.com",
    "*.example.com"
]

# تعداد کانکشن‌های همزمان در Pool برای هر سرور (هر نود کلاینت) - برای مدیریت بهینه ترافیک
pool_size_per_node = 8

# تنظیمات مربوط به فایل‌های آی‌پی
clean_ip_file = "ips/clean_ips.txt"     # cache آی‌پی‌های تمیز؛ نتیجهٔ خالی اسکن cache قبلی را پاک نمی‌کند
scanner_cdn = "auto"                        # auto | arvancloud | cloudflare  (رنج آی‌پی اسکنر؛ auto = تشخیص خودکار از DNS دامنه)
source_ips_file = "ips/cloudflare_ip_ranges.txt"   # فایل رنج‌های Cloudflare؛ فایل ArvanCloud: ips/arvancloud_ip_ranges.txt

# فاصله زمانی بررسی سلامت آی‌پی‌ها (دقیقه)
check_interval_minutes = 360

# حداکثر پینگ مجاز برای آی‌پی‌های تمیز (میلی‌ثانیه)
max_ping_ms = 150

# تنظیمات دریافت خودکار گواهینامه Let's Encrypt (DNS-01 Challenge) برای دامنه‌های لوکال
cloudflare_api_token = "YOUR_CLOUDFLARE_API_TOKEN"
arvancloud_api_token = "YOUR_ARVANCLOUD_API_TOKEN"

# (اختیاری) کپی خودکار گواهینامه‌های تولید شده/تمدید شده به مسیرهای مشخص (پوشه certs ایجاد می‌شود)
copy_certs_to = [
    "/etc/xray",
    "/opt/proxy"
]

# (اختیاری) سطح لاگ‌گیری سیستم: "trace", "debug", "info", "warn", "error"
log_level = "info"

# 🔀 (اختیاری) پروتکل‌های تانل، به ترتیب اولویت — برای Direct و Reverse هر دو
#  "h2"     = HTTP/2 (gRPC)
#  "wssmux" = WebSocket روی TLS + multiplexer (yamux)
# اولین پروتکل ترجیح داده می‌شود؛ اگر وصل نشد (یا وصل شد ولی تونل را عبور نداد، مثلاً CDN بدون gRPC)
# برنامه خودکار به پروتکل بعدی سوئیچ می‌کند. اگر ننویسید: ["h2", "wssmux"]. برای رفتار قبلی: ["h2"]
# protocols = ["h2", "wssmux"]

# فاصلهٔ پایش مستقل سلامت مسیرهای تونل (دقیقه؛ پیش‌فرض ۱، حداقل ۱)
tunnel_health_check_interval_minutes = 1

# 🔁 (اختیاری) حالت Reverse — همزمان با تانل Direct کار می‌کند
# پورتی که سرور خارج (مستقیم یا از طریق CDN) به آن وصل می‌شود. برای Cloudflare یکی از پورت‌های
# 443 / 2053 / 2083 / 2087 / 2096 / 8443 را بگذارید. اگر تنظیم نشود، Reverse غیرفعال است.
# reverse_bind_addr = "0.0.0.0:2083"
# دامنه‌های تانل Reverse (مثل tunnel_sni در سرور). دو کار می‌کند:
#  ۱) اتصال‌هایی که SNI آن‌ها با این دامنه‌ها بخورد روی «هر» پورتِ کلاینت (مثلاً 443 مشترک با port_mappings/web_server) به Reverse می‌روند.
#  ۲) برای زون این دامنه‌ها گواهی SSL از نوع Wildcard (zone + *.zone) خودکار با ACME گرفته و تمدید می‌شود
#     (نیازمند cloudflare_api_token یا arvancloud_api_token در همین بخش [client]).
# reverse_tunnel_sni = ["*.example.com"]


# ====================================================================
# تنظیمات مسیریابی پورت‌ها (Remote Routing)
# ترافیک دریافتی روی پورت‌های لوکال به کدام SNI و سپس به کدام پورت در مقصد (Target) هدایت شود.
# ====================================================================

# 🔁 نکته Reverse: تانل Reverse بدون location (در server.toml) فقط فورواردر است: برای همهٔ مقصدها پس از تانل لوکیشن خودِ مقصد
# استفاده می‌شود و سرور مستقیم به هاست مقصد وصل می‌شود (try_local = false). تانل با location برای مقصدهای همان لوکیشن
# به localhost سرور وصل می‌شود (try_local = true) و برای لوکیشن‌های دیگر طبق share_sni به‌عنوان پشتیبان عمل می‌کند.
[[client.remotes]]
location = "Germany"
# اگر ۱ باشد، یعنی درخواست‌ها می‌توانند از SNI‌های داخلی کلاینت استفاده کنند (ترافیک بازگشتی مجاز است)
share_sni = 1
sni = [
    "sni1.example.com:443",
    "sni2.example.com:443"
]
port_mappings = [
    "sni.nl.example.com:443=127.0.0.1:443",
    "8443=8443",    # هدایت ترافیک پورت 443 لوکال به پورت 443 مقصد
]

[[client.remotes]]
location = "Turkey"
# اگر ۰ باشد، اشتراک SNI غیرفعال است.
share_sni = 0
sni = [
    "sni3.example.com:443"
]
port_mappings = [
    "sni.de.example.com:443=dist.domain.com:443",
    "8443:443",    # هدایت ترافیک پورت 8443 لوکال به پورت 443 مقصد
]

# تنظیمات مسیریابی فوق‌سریع ترافیک بر اساس دامنه (SNI Routing) برای کلاینت (اختیاری)
[[client.sni_proxy]]
incoming_sni = [
    "us.SNI.COM:443",
    "fr.SNI.COM:443",
    "tr.SNI.COM:443",
]
target = [
    "127.0.0.1:9443",
]


# ====================================================================
# مسیرهای مستقل کلاینت به عنوان وب‌سرور لایه ۷
# ترافیک را روی پورت لوکال با گواهی سرور دریافت و پردازش می‌کند.
# ====================================================================

# 1. حالت استاتیک (نمایش فایل‌های پنل یا HTML)
[[client.web_server]]
domain = "shop.example.com"
path = "/"
type = "static"
root = "panel/dist"

# 2. حالت استاتیک پیشرفته با Rewrite مسیر
[[client.web_server]]
domain = "static.example.com"
path = "/"
type = "static"
root = "/var/www/html"
"/" = "/index.html"

# 3. حالت FastCGI (برای سایت‌های PHP)
[[client.web_server]]
domain = "dl.example.com"
path = "/"
type = "fastcgi"
root = "/var/www/html"
target = "unix:///var/run/php/php8.1-fpm.sock"
"/" = "/download.php"

# 4. حالت Reverse Proxy (برای اتصال به وب‌پنل یا سرویس‌های دیگر)
[[client.web_server]]
domain = "chat.example.com"
path = "/"
type = "reverse_proxy"
target = "127.0.0.1:8080"

# ====================================================================
# 🖥️ وب‌پنل مدیریت (اختیاری) — ورود با نام کاربری و رمز عبور
# ====================================================================
# پنل داخل خودِ برنامه اجرا می‌شود (بدون نیاز به وب‌سرور یا دیتابیس جدا) و داشبورد ترافیک زنده،
# وضعیت تانل‌ها و اتصال‌ها، لاگ، ویرایشگر تنظیمات (با Hot-Reload و نسخه‌ی پشتیبان) و وضعیت گواهی‌ها را نشان می‌دهد.
# پیش‌فرض فقط روی 127.0.0.1 گوش می‌دهد.
#
# دسترسی امن از راه دور:
#   الف) تونل SSH:  ssh -L 8088:127.0.0.1:8088 user@server  و سپس باز کردن http://127.0.0.1:8088
#   ب) انتشار با TLS از طریق وب‌سرور داخلی (reverse_proxy به 127.0.0.1:8088) و تنظیم trust_proxy = true
[admin]
enabled = true
bind_addr = "127.0.0.1:8088"
# نام کاربری و رمز ورود را همین‌جا تعیین کنید (با ذخیره‌ی فایل و Hot-Reload بلافاصله اعمال می‌شود؛ رمز دست‌کم ۱۰ نویسه):
username = "admin"
password = "admin"
# اگر password را ننویسید، در اولین اجرا رمز تصادفی ساخته و فقط یک‌بار در ترمینال چاپ می‌شود
# (و در فایل admin_credentials.json ذخیره می‌شود). با تعیین password، آن فایل دیگر استفاده نمی‌شود.
# توصیه: دسترسی فایل پیکربندی را محدود کنید:  chmod 600 config.toml
# credentials_file = "admin_credentials.json"
# session_ttl_minutes = 480          # مدت بی‌فعالیتی تا خروج خودکار
# trust_proxy = false                # فقط پشت reverse_proxy داخلی/معتبر true کنید
# read_only = false                  # true = پنل فقط نمایش می‌دهد و تغییر/عملیات را رد می‌کند

[[client.web_server]]
domain = "panel.example.com"
path = "/"
type = "reverse_proxy"
target = "127.0.0.1:8088"
